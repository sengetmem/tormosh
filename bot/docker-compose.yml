# Бот заказов TORMOSH. Токен и id владельца — в .env рядом (в git не кладётся)
services:
  bot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    # На сервере 1 ГБ памяти и рядом бот бюджета. Сам бот занимает ~140 МБ (aiogram тянет pydantic):
    # при 128m он упирался в предел и уходил в swap
    mem_limit: 256m
    logging:
      options:
        max-size: "1m"
        max-file: "3"
